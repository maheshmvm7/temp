<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Transfer</title>
    <link rel="stylesheet" href="style.css">
    <!-- QR Code Generator -->
    <script src="qrcode.min.js"></script>
    <!-- QR / Camera Scanner -->
    <script src="html5-qrcode.min.js" type="text/javascript"></script>
</head>

<body>

    <main class="app">

        <header class="header">
            <div class="logo">P2P</div>

            <div class="status">
                <span id="status-dot"></span>
                <span id="status-text">Waiting</span>
            </div>
        </header>


        <section class="connection">

            <div class="heading">
                <span class="eyebrow">PEER CONNECTION</span>
                <h1 id="title">Connect device</h1>
                <p id="description">Scan this QR code from another device to establish a connection.</p>
            </div>


            <!-- Toggle -->

            <div class="toggle-wrapper">
                <button class="toggle-option active" id="show-qr-btn" type="button">My QR</button>
                <button class="toggle-option" id="scan-qr-btn" type="button">Scan QR</button>
            </div>


            <!-- QR Section -->

            <div id="qr-section" class="panel">

                <div class="qr-container">

                    <div id="qrcode"></div>

                </div>

                <div class="peer-info">
                    <span class="label">DEVICE ID</span>
                    <span id="peer-id">Generating...</span>
                </div>

                <p class="hint">Open this page on another device and scan this QR code.</p>

            </div>


            <!-- Scanner Section -->

            <div id="scanner-section" class="panel hidden">

                <div id="reader"></div>
                <div class="scanner-message" id="scanner-message">Camera is starting...</div>

            </div>


            <!-- Connection Result -->

           <div id="connection-result" class="connection-result hidden">

    <span class="result-label">CONNECTION ACTIVE</span>

    <strong id="connected-peer">
        DIRECT PEER CONNECTION
    </strong>

    <span class="result-status">
        WebRTC peer-to-peer connection established
    </span>

</div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
