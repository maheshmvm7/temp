<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>P2P Transfer</title>

    <link rel="stylesheet" href="style.css">

    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

    <!-- QR Generator -->
    <script src="qrcode.min.js"></script>

    <!-- QR Scanner -->
    <script src="html5-qrcode.min.js"></script>
</head>

<body>

    <main class="app">

        <header class="header">

            <div class="logo">
                P2P
            </div>

            <div class="status">

                <span id="status-dot"></span>

                <span id="status-text">
                    Starting...
                </span>

            </div>

        </header>


        <section class="connection">

            <div class="heading">

                <span class="eyebrow">
                    PEER CONNECTION
                </span>

                <h1>
                    Connect device
                </h1>

                <p id="description">
                    Show your QR code or scan another device.
                </p>

            </div>


            <div class="toggle-wrapper">

                <button
                    class="toggle-option active"
                    id="show-qr-btn"
                    type="button"
                >
                    My QR
                </button>

                <button
                    class="toggle-option"
                    id="scan-qr-btn"
                    type="button"
                >
                    Scan QR
                </button>

            </div>


            <!-- MY QR -->

            <div
                id="qr-section"
                class="panel"
            >

                <div class="qr-container">

                    <div id="qrcode"></div>

                </div>


                <div class="peer-info">

                    <span class="label">
                        DEVICE ID
                    </span>

                    <span id="peer-id">
                        Connecting...
                    </span>

                </div>


                <p class="hint">
                    Scan this QR code from another device.
                </p>

            </div>


            <!-- SCANNER -->

            <div
                id="scanner-section"
                class="panel hidden"
            >

                <div id="reader"></div>

                <div
                    id="scanner-message"
                    class="scanner-message"
                >
                    Camera is starting...
                </div>

            </div>


            <!-- CONNECTION RESULT -->

            <div
                id="connection-result"
                class="connection-result hidden"
            >

                <span class="result-label">
                    CONNECTED
                </span>

                <strong id="connected-peer">
                    —
                </strong>

                <span class="result-status">
                    Peer-to-peer connection established
                </span>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
